name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Assert our own floor rather than inheriting the repository default, which is
# a setting someone can change without it showing up in review.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

      # Releases ship musl, not glibc, so a musl-only break must fail here
      # rather than on the day a tag is pushed.
      - name: release target builds (musl)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl

  msrv:
    name: minimum supported Rust (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.82"
      - name: the declared rust-version must match the job
        run: |
          declared=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          echo "Cargo.toml declares $declared"
          test "$declared" = "1.82"
          # A rust-toolchain.toml would silently override the pin above and
          # make this job test stable instead of the MSRV.
          test ! -e rust-toolchain.toml && test ! -e rust-toolchain
          rustc --version | grep -q '1\.82'
      - run: cargo check --locked --all-targets

  deps:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  lua:
    name: lua (neovim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares nvim >= 0.11; test the floor and the current release.
        neovim: [v0.11.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      # The suite needs only `nvim`. Checks that additionally require the
      # release binary or the `herdr` CLI relax themselves when those are
      # absent, which is the case here.
      - run: scripts/lua-tests.sh

  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests/lua

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: syntax
        run: |
          sh -n scripts/build.sh
          bash -n scripts/build-tests.sh
          bash -n scripts/lua-tests.sh
          bash -n scripts/e2e.sh
      # scripts/build.sh runs on a user's machine during `herdr plugin
      # install`, so its refusal paths are the ones worth testing. The suite
      # lives in a script rather than inline here so `make scripts` runs
      # exactly what CI runs.
      - name: build.sh behaviour
        run: scripts/build-tests.sh
